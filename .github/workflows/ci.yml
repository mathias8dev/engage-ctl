name: Build and release engagectl
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engage-ctl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: node scripts/release.mjs --check-tag
      - id: targets
        run: node -e "import('./scripts/targets.mjs').then(m => console.log('matrix='+JSON.stringify({include:m.TARGETS})))" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - run: pnpm test:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engagectl-${{ matrix.target }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engagectl-*
          merge-multiple: true
          path: dist/releases
      - run: node scripts/release.mjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
